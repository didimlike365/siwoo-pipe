const rnd=(a,b)=>a+Math.random()*(b-a), ri=n=>Math.floor(Math.random()*n);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const mf=n=>440*Math.pow(2,(n-69)/12);
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return `rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`;}
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function txt(s,x,y,size,color,opt={}){
  ctx.save();ctx.font=`${size}px ${opt.font||FB}`;ctx.textAlign=opt.align||'center';ctx.textBaseline='middle';
  if(opt.alpha!=null)ctx.globalAlpha=opt.alpha;
  if(opt.stroke){ctx.lineJoin='round';ctx.lineWidth=opt.sw||size*0.18;ctx.strokeStyle=opt.stroke;ctx.strokeText(s,x,y);}
  if(opt.glow){ctx.shadowColor=opt.glow;ctx.shadowBlur=opt.blur||12;}
  ctx.fillStyle=color;ctx.fillText(s,x,y);ctx.restore();
}
function wrap(text,maxW,size,font){
  ctx.font=`${size}px ${font||FB}`;const out=[];
  for(const para of text.split('\n')){
    let line='';
    for(const ch of para){const t=line+ch;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=ch.trim()?ch:'';}else line=t;}
    out.push(line);
  }
  return out;
}

    lead:[[0,74,4],[4,78,4],[8,81,8],[16,83,4],[20,81,4],[24,79,8],[32,81,4],[36,85,4],[40,88,8],[48,86,16]]

};
const LEAD={};for(const k in MUS){const a=new Array(64).fill(null);for(const [st,n,l] of MUS[k].lead)a[st]=[n,l];LEAD[k]=a;}
const AU={c:null,mode:'title',step:0,next:0,T:0.3,tr:0,loops:0,
  init(){
    if(this.c){if(this.c.state==='suspended')this.c.resume();return;}
    try{
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      const c=this.c=new C();
      this.master=c.createGain();this.master.gain.value=SAVE.muted?0:0.85;this.master.connect(c.destination);
      this.comp=c.createDynamicsCompressor();this.comp.threshold.value=-16;this.comp.ratio.value=4;this.comp.attack.value=0.004;this.comp.release.value=0.2;this.comp.connect(this.master);
      this.sfx=c.createGain();this.sfx.connect(this.comp);
      this.mus=c.createGain();this.mus.gain.value=0.4;this.mus.connect(this.comp);
      const rl=Math.floor(c.sampleRate*2.2),ir=c.createBuffer(2,rl,c.sampleRate);
      for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<rl;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/rl,2.8);}
      this.rev=c.createConvolver();this.rev.buffer=ir;this.rev.connect(this.comp);
      this.revIn=c.createGain();this.revIn.gain.value=0.2;this.mus.connect(this.revIn);this.revIn.connect(this.rev);
      const len=c.sampleRate*2,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.nb=b;
      this.waterG=this.loop('bandpass',650,0.6);this.fireG=this.loop('lowpass',380,0.7);
      this.next=c.currentTime+0.05;
    }catch(e){this.c=null;}
  },
  loop(type,f,q){const c=this.c,s=c.createBufferSource();s.buffer=this.nb;s.loop=true;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=c.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(this.sfx);s.start();return g;},
  tone(f,dur,type,vol,slide,when,dest){
    if(!this.c)return;const c=this.c,t=when||c.currentTime;const o=c.createOscillator(),g=c.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(dest||this.sfx);o.start(t);o.stop(t+dur+0.03);
  },
  noise(dur,vol,type,f,when,dest,q){
    if(!this.c)return;const c=this.c,t=when||c.currentTime;const s=c.createBufferSource();s.buffer=this.nb;
    const fl=c.createBiquadFilter();fl.type=type||'lowpass';fl.frequency.value=f||1000;fl.Q.value=q||1;
    const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(fl);fl.connect(g);g.connect(dest||this.sfx);s.start(t,Math.random()*1.5,dur+0.05);
  },
  osc(type,f,t,det){const o=this.c.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(det)o.detune.setValueAtTime(det,t);return o;},
  brass(f,dur,t,v){
    const c=this.c,g=c.createGain(),fl=c.createBiquadFilter();fl.type='lowpass';fl.Q.value=2;v=v||0.09;
    fl.frequency.setValueAtTime(500,t);fl.frequency.exponentialRampToValueAtTime(3400,t+0.04);fl.frequency.exponentialRampToValueAtTime(1500,t+0.25);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.025);g.gain.setValueAtTime(v,t+Math.max(0.03,dur-0.05));g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.08);
    for(const dt of [-7,7]){const o=this.osc('sawtooth',f,t,dt);o.connect(fl);o.start(t);o.stop(t+dur+0.12);}
    const o2=this.osc('square',f/2,t,0),g2=c.createGain();g2.gain.value=0.3;o2.connect(g2);g2.connect(fl);o2.start(t);o2.stop(t+dur+0.12);
    fl.connect(g);g.connect(this.mus);
  },
  pad(f,dur,t,T){
    const c=this.c,g=c.createGain(),fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=600+2000*T;
    const v=0.018+0.012*T;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.2);g.gain.setValueAtTime(v,t+Math.max(0.25,dur-0.2));g.gain.linearRampToValueAtTime(0.0001,t+dur+0.1);
    for(const dt of [-9,0,9]){const o=this.osc('sawtooth',f,t,dt);o.connect(fl);o.start(t);o.stop(t+dur+0.15);}
    fl.connect(g);g.connect(this.mus);
  },
  // 빠른 현악 스타카토(긴박감)
  stab(f,dur,t,v){
    const c=this.c,g=c.createGain(),fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=2600;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    for(const dt of [-6,6]){const o=this.osc('sawtooth',f,t,dt);o.connect(fl);o.start(t);o.stop(t+dur+0.03);}
    fl.connect(g);g.connect(this.mus);
  },
  bass(f,dur,t){
    const c=this.c,g=c.createGain(),fl=c.createBiquadFilter();fl.type='lowpass';fl.Q.value=4;
    fl.frequency.setValueAtTime(1000,t);fl.frequency.exponentialRampToValueAtTime(260,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.2,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    const o=this.osc('sawtooth',f,t,0),o2=this.osc('sine',f/2,t,0);o.connect(fl);o2.connect(fl);o.start(t);o2.start(t);o.stop(t+dur+0.05);o2.stop(t+dur+0.05);
    fl.connect(g);g.connect(this.mus);
  },
  // 사이렌 "삐-뽀": 앞 절반 높은음, 뒤 절반 낮은음, 미끄러짐+비브라토
  sirenVoice(hi,lo,dur,t,v,dest){
    const c=this.c,fl=c.createBiquadFilter(),g=c.createGain(),lfo=c.createOscillator(),lg=c.createGain();
    fl.type='lowpass';fl.frequency.value=2400;fl.Q.value=1.2;lfo.frequency.value=6;lg.gain.value=hi*0.012;lfo.connect(lg);
    const half=dur/2,oscs=[this.osc('sawtooth',lo,t,0),this.osc('square',lo,t,6)];
    for(const o of oscs){const fq=o.frequency;fq.setValueAtTime(lo*0.94,t);fq.linearRampToValueAtTime(hi,t+0.09);fq.setValueAtTime(hi,t+half-0.06);fq.linearRampToValueAtTime(lo,t+half+0.04);
      lg.connect(fq);o.connect(fl);o.start(t);o.stop(t+dur+0.12);}
    lfo.start(t);lfo.stop(t+dur+0.12);
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.08);g.gain.setValueAtTime(v,t+dur-0.1);g.gain.linearRampToValueAtTime(0.0001,t+dur+0.08);
    fl.connect(g);g.connect(dest||this.mus);g.connect(this.rev);
  },
  // 짧게 끊는 사이렌 한 방(리듬용): 살짝 아래에서 미끄러져 올라오는 "삐"/"뽀"
  sirenChop(f,dur,t,v){
    const c=this.c,fl=c.createBiquadFilter(),g=c.createGain();fl.type='lowpass';fl.frequency.value=2600;fl.Q.value=1.5;
    for(const [ty,det] of [['sawtooth',0],['square',8]]){const o=this.osc(ty,f*0.92,t,det);o.frequency.linearRampToValueAtTime(f,t+Math.min(0.05,dur*0.3));o.connect(fl);o.start(t);o.stop(t+dur+0.05);}
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.012);g.gain.setValueAtTime(v,t+dur*0.75);g.gain.linearRampToValueAtTime(0.0001,t+dur);
    fl.connect(g);g.connect(this.mus);g.connect(this.rev);
  },
  // "우웅~" 상승 사이렌(마디 시작 강조)
  sirenWhoop(lo,hi,dur,t,v){
    const c=this.c,fl=c.createBiquadFilter(),g=c.createGain();fl.type='lowpass';fl.frequency.value=2200;
    const o=this.osc('sawtooth',lo,t,0);o.frequency.exponentialRampToValueAtTime(hi,t+dur*0.85);o.connect(fl);o.start(t);o.stop(t+dur+0.05);
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+dur*0.3);g.gain.setValueAtTime(v,t+dur*0.8);g.gain.linearRampToValueAtTime(0.0001,t+dur);
    fl.connect(g);g.connect(this.mus);g.connect(this.rev);
  },
  // 마림바(나무 실로폰) 소리
  pluck(f,dur,t,v){
    const c=this.c,g=c.createGain(),d=Math.min(0.7,Math.max(0.25,dur));
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    const o=this.osc('sine',f,t,0),o2=this.osc('sine',f*4,t,0),g2=c.createGain();g2.gain.setValueAtTime(0.22,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.08);
    o.connect(g);o2.connect(g2);g2.connect(g);o.start(t);o2.start(t);o.stop(t+d+0.05);o2.stop(t+0.12);g.connect(this.mus);
  },
  // 글로켄슈필(맑은 실로폰) 멜로디
  glock(f,dur,t,v){
    const c=this.c,g=c.createGain(),d=Math.min(0.9,Math.max(0.35,dur*1.3));
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    for(const [ty,m,a] of [['triangle',1,1],['sine',2,0.45],['sine',4.2,0.18]]){const o=this.osc(ty,f*m,t,0),og=c.createGain();og.gain.value=a;o.connect(og);og.connect(g);o.start(t);o.stop(t+d+0.05);}
    g.connect(this.mus);
  },
  // 박수
  clap(t,v){for(let k=0;k<3;k++)this.noise(0.02,v*0.7,'bandpass',1400,t+k*0.011,this.mus,0.8);this.noise(0.13,v,'bandpass',1300,t+0.033,this.mus,0.7);},
  // 새소리 "찌르르"
  chirp(t,v,dest){for(let k=0;k<2;k++){const tt=t+k*0.11;this.tone(rnd(1700,2000),0.12,'sine',v,rnd(2500,2900),tt,dest||this.mus);}},
  pump(){if(!this.c)return;const t=this.c.currentTime;this.tone(70,1.0,'sawtooth',0.12,180,t);this.noise(1.0,0.2,'lowpass',600,t,this.sfx);this.tone(900,0.15,'sine',0.08,1200,t+0.9);},

function drawFlower(c,x,base,f,growth,droop,bk,t,dry){
  const L=(0.09+0.17*growth)*f.h,a=droop*1.25*f.side+Math.sin(t*1.5+f.ph)*0.05*(1-droop);
  const tipX=x+Math.sin(a)*L,tipY=base-Math.cos(a)*L;
  c.strokeStyle=mix('#3fa34d','#8a8a3a',dry);c.lineWidth=0.012;c.lineCap='round';
  c.beginPath();c.moveTo(x,base);c.quadraticCurveTo(x,base-L*0.6,tipX,tipY);c.stroke();
  const lx=x+Math.sin(a)*L*0.2,ly=base-L*0.32;c.fillStyle=mix('#4cc35a','#a8a24a',dry);
  for(const sd of [-1,1]){c.save();c.translate(lx,ly);c.rotate(sd*(0.9+droop*0.6));c.beginPath();c.ellipse(0,-0.02*growth-0.01,0.009,0.022*growth+0.01,0,0,7);c.fill();c.restore();}
  c.save();c.translate(tipX,tipY);c.rotate(a+droop*0.9*f.side);
  if(growth<0.5&&bk<=0){
    c.fillStyle=mix(f.col,'#7a6a4a',dry*0.7);c.beginPath();c.ellipse(0,-0.012,0.011,0.018,0,0,7);c.fill();
    c.fillStyle='#3fa34d';c.beginPath();c.ellipse(-0.006,-0.003,0.006,0.01,-0.5,0,7);c.ellipse(0.006,-0.003,0.006,0.01,0.5,0,7);c.fill();
  }else{
    const open=bk>0?Math.max(bk,0.3):clamp((growth-0.4)/0.6,0.25,1);
    const R=(0.018+0.026*open)*(1-0.25*droop)*f.h,pc=mix(f.col,'#9a8a6a',dry*0.65),wob=bk>0&&bk<1?Math.sin(t*12)*0.1:0;
    c.fillStyle=pc;
    for(let k=0;k<f.petals;k++){c.save();c.rotate(k/f.petals*Math.PI*2+wob);c.beginPath();c.ellipse(0,-R*0.62,R*0.38,R*0.62,0,0,7);c.fill();c.restore();}
    c.fillStyle=mix('#ffd23a','#b09040',dry);c.beginPath();c.arc(0,0,R*0.4,0,7);c.fill();
    if(bk>0.85){c.fillStyle='#5a3a10';c.beginPath();c.arc(-R*0.13,-R*0.06,R*0.06,0,7);c.arc(R*0.13,-R*0.06,R*0.06,0,7);c.fill();
      c.strokeStyle='#5a3a10';c.lineWidth=R*0.06;c.beginPath();c.arc(0,R*0.06,R*0.14,0.2,Math.PI-0.2);c.stroke();}
  }
  c.restore();
}

      c.strokeStyle='rgba(255,220,160,0.7)';c.lineWidth=0.008;c.beginPath();c.ellipse(A*0.22,0.28,0.16,0.035,-0.3,0,7);c.stroke();c.globalAlpha=1;}
    // 지상 (카메라 따라 내려감)
    c.save();c.translate(0,cam);

      c.fillStyle='#2a1a3a';c.beginPath();c.moveTo(0,0.8);for(let xx=0;xx<=A+0.1;xx+=0.15)c.lineTo(xx,0.74+Math.sin(xx*7)*0.03);c.lineTo(A,0.9);c.lineTo(0,0.9);c.fill();
      c.fillStyle='#3a3a4a';c.fillRect(0,g.ground,A,0.3);
      // 발사대
      c.fillStyle='#6a6e80';c.fillRect(g.rx-g.rw*1.6,g.ground-0.03,g.rw*3.2,0.03);
      c.fillStyle='#4a4e60';c.fillRect(g.rx-g.rw*1.4,g.ground-0.012,g.rw*0.3,0.012);c.fillRect(g.rx+g.rw*1.1,g.ground-0.012,g.rw*0.3,0.012);
      // 발사탑
      const twx=g.rx+g.rw*1.25,twh=g.rh*1.15,tww=0.045;
      c.strokeStyle='#d9342a';c.lineWidth=0.006;c.strokeRect(twx,g.ground-0.03-twh,tww,twh);
      for(let yy=0;yy<twh;yy+=0.04){c.beginPath();c.moveTo(twx,g.ground-0.03-yy);c.lineTo(twx+tww,g.ground-0.07-yy);c.stroke();}
      const armOut=S.ign>0?Math.max(0,1-S.ign*2):1;c.fillStyle='#b8231c';c.fillRect(twx-g.rw*0.55*armOut,g.ground-0.03-g.rh*0.7,g.rw*0.55*armOut+0.005,0.012);

      c.beginPath();c.arc(twx+tww/2,g.ground-0.04-twh,0.012,0,7);c.fill();
      if(blink){c.globalCompositeOperation='lighter';c.drawImage(glowSprite(I>0.7?'255,60,30':'255,180,40'),twx+tww/2-0.06,g.ground-0.04-twh-0.06,0.12,0.12);c.globalCompositeOperation='source-over';}
      // 연료 탱크

      c.fillStyle=tg;rr(c,tkx-tkw/2,g.ground-tkh,tkw,tkh,0.03);c.fill();
      c.fillStyle='#ff9a2a';c.fillRect(tkx-tkw/2,g.ground-tkh*0.55,tkw,0.02);
      c.strokeStyle='#ff9a2a';c.lineWidth=0.02;c.lineCap='round';c.beginPath();c.moveTo(tkx+tkw/2,g.ground-0.04);c.quadraticCurveTo(tkx+0.12,0.96,tkx+0.08,1.1);c.stroke();
    }

    for(const p of S.p){if(p.k===1||p.k===2){const a=1-p.life/p.max,r=p.s*2;c.globalAlpha=(p.k===1?0.5:0.6)*a;c.drawImage(p.k===1?sm:sm2,p.x-r,p.y+cam-r,r*2,r*2);}}
    c.globalAlpha=1;
    // 로켓
    const ryb=g.ground-0.03-S.lift+cam;
    const shake=(S.ign>0&&S.lift<0.2)?rnd(-0.003,0.003):0;

      c.globalAlpha=(1-q)*0.7;c.drawImage(glowSprite(col),p.x-r+shake,p.y-S.lift+cam-r,r*2,r*2.4);}
    c.globalAlpha=1;c.globalCompositeOperation='source-over';
    const hideCap=G.phase==='tally'||G.phase==='won';
    drawRocketBody(c,g.rx+shake,ryb,g.rw,g.rh,S.fuel,t,hideCap?'hide':mood,S.ign);
    S.capyScreen={x:x+g.rx*h,y:y+(ryb-g.rh*0.64)*h,size:g.rw*0.3*h*1.6};
    c.restore();
    const X=u=>x+u*h,Y=v=>y+v*h;
    if(cam<0.4)txt('연료',X(g.tx),Y(g.ground-0.065+cam),Math.max(10,h*0.04),'#7a3a00',{font:FT});
    const msg=mood==='happy'?(S.lift>0.2?'우주로 출발~!':'점화 성공!'):mood==='sad'?'다시 해봐요!':(I>0.65?'발사 시간이 다가와요!':'연료를 넣어줘요!');
    if(!hideCap)bubble(X(g.rx),Y(ryb-g.rh*0.98)+Math.sin(t*4)*2,msg,Math.max(11,h*0.045),rect);
  };
  return S;
}

function makeOnsenScene(){
  const S={A:1.5,p:[],intensity:0.3,time:0,bloom:0,fill:0};
  S.reset=function(){
    S.p=[];S.intensity=0.3;S.time=0;S.bloom=0;S.fill=0;
    S.fam=[{s:1,ph:0},{s:0.85,ph:2},{s:0.6,ph:4}];
  };
  S.geom=function(A){const k=clamp(A/1.6,0.6,1),px=A*0.58,prx=Math.min(0.46,A*0.32);
    return {k,px,py:0.82,prx,pry:0.085,ground:0.74,sx:0.07};};
  S.update=function(dt,G){
    S.time+=dt;const ph=G.phase==='tally'?'won':G.phase;let target=0.3,rate=0.25;
    if(ph==='countdown'||ph==='flow')target=0.3+0.65*clamp(G.elapsed/G.dangerT,0,1);
    else if(ph==='saving'||ph==='won'||ph==='tally'){target=0;rate=0.5;}
    else if(ph==='leak'||ph==='lost'){target=1;rate=0.5;}
    S.intensity+=clamp(target-S.intensity,-rate*dt,rate*dt);
    if(ph==='saving'||ph==='won'||ph==='tally'){S.bloom=Math.min(3,S.bloom+dt/2.4);S.fill=Math.min(1,S.fill+dt*0.6);}
    const g=S.geom(S.A),A=S.A,I=S.intensity;
    // 눈: 급할수록 많고 비스듬히(눈보라)
    const rateSnow=(ph==='saving'||ph==='won'||ph==='tally')?6:12+50*I;
    if(Math.random()<dt*rateSnow*2)S.p.push({k:0,x:rnd(-0.2,A+0.2),y:-0.02,vx:rnd(-0.02,0.02)-0.15*I,vy:rnd(0.06,0.12)+0.12*I,life:0,max:12,s:rnd(0.004,0.009)});
    // 김
    if(S.fill>0.1&&Math.random()<dt*25*S.fill)S.p.push({k:1,x:g.px+rnd(-g.prx*0.8,g.prx*0.8),y:g.py-0.02,vx:rnd(-0.01,0.02),vy:rnd(-0.06,-0.03),life:0,max:rnd(1.5,2.6),s:rnd(0.02,0.035)});
    // 하아~ 거품
    if(S.bloom>1.2&&Math.random()<dt*2)S.p.push({k:2,x:g.px+rnd(-g.prx*0.5,g.prx*0.5),y:g.py-0.05,vx:0,vy:-0.05,life:0,max:1.4,s:0.008});
    for(const p of S.p){p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k===0&&p.y>g.ground+0.02)p.life=p.max;if(p.k===1)p.s+=0.02*dt;}
    S.p=S.p.filter(p=>p.life<p.max);if(S.p.length>600)S.p.splice(0,S.p.length-600);
  };
  S.draw=function(c,rect,G){
    const {x,y,w,h}=rect,A=w/h;S.A=A;const g=S.geom(A),I=S.intensity,t=S.time,cold=clamp((I-0.2)/0.8,0,1);
    const ph=G.phase,happy=ph==='saving'||ph==='won'||ph==='tally',sad=ph==='lost'||ph==='leak',hide=ph==='tally'||ph==='won';
    c.save();c.beginPath();c.rect(x,y,w,h);c.clip();c.translate(x,y);c.scale(h,h);
    const gr=c.createLinearGradient(0,0,0,0.8);gr.addColorStop(0,mix('#3a4a8a','#1a2244',cold));gr.addColorStop(1,mix('#c9b8d8','#7a88a8',cold));c.fillStyle=gr;c.fillRect(0,0,A,1);
    // 달
    c.fillStyle='rgba(255,250,230,0.9)';c.beginPath();c.arc(A*0.85,0.13,0.04,0,7);c.fill();
    // 눈 덮인 산
    c.fillStyle='#5a6a8a';c.beginPath();c.moveTo(0,0.62);c.lineTo(A*0.22,0.3);c.lineTo(A*0.45,0.62);c.fill();
    c.fillStyle='#6a7a9a';c.beginPath();c.moveTo(A*0.3,0.62);c.lineTo(A*0.62,0.24);c.lineTo(A*1.0,0.62);c.fill();
    c.fillStyle='#f4f8ff';c.beginPath();c.moveTo(A*0.22,0.3);c.lineTo(A*0.27,0.37);c.lineTo(A*0.2,0.36);c.lineTo(A*0.17,0.37);c.fill();
    c.beginPath();c.moveTo(A*0.62,0.24);c.lineTo(A*0.69,0.33);c.lineTo(A*0.62,0.31);c.lineTo(A*0.56,0.32);c.fill();
    // 대나무 울타리
    for(let bx=A*0.3;bx<A*0.95;bx+=0.035){c.fillStyle=(Math.round(bx*100)%2)?'#8a7a3a':'#9a8a48';c.fillRect(bx,0.5,0.03,0.24);}
    c.fillStyle='#6a5a2a';c.fillRect(A*0.3,0.55,A*0.65,0.012);c.fillRect(A*0.3,0.66,A*0.65,0.012);
    // 눈밭
    c.fillStyle='#eef3ff';c.fillRect(0,g.ground,A,1-g.ground);
    // 석등
    const lx=A-0.07;c.fillStyle='#8a8e98';c.fillRect(lx-0.012,0.6,0.024,0.14);c.fillRect(lx-0.03,0.56,0.06,0.04);
    c.fillStyle='#ffcf6a';c.fillRect(lx-0.016,0.575,0.032,0.022);c.globalCompositeOperation='lighter';c.drawImage(glowSprite('255,200,90'),lx-0.08,0.5,0.16,0.16);c.globalCompositeOperation='source-over';
    c.fillStyle='#8a8e98';c.beginPath();c.moveTo(lx-0.045,0.565);c.lineTo(lx,0.535);c.lineTo(lx+0.045,0.565);c.fill();
    // 온천 탕
    c.fillStyle='#4a4e58';c.beginPath();c.ellipse(g.px,g.py,g.prx,g.pry,0,0,7);c.fill();
    if(S.fill>0){const wc=mix('#7fc8ff','#ffb06a',0.75);c.fillStyle=wc;c.globalAlpha=0.9;c.beginPath();c.ellipse(g.px,g.py+g.pry*(1-S.fill)*0.5,g.prx*(0.6+0.38*S.fill),g.pry*(0.5+0.45*S.fill),0,0,7);c.fill();c.globalAlpha=1;
      c.strokeStyle='rgba(255,255,255,0.35)';c.lineWidth=0.004;for(let k=0;k<3;k++){c.beginPath();c.ellipse(g.px+Math.sin(t+k)*0.05,g.py,g.prx*(0.2+0.12*k),g.pry*(0.2+0.12*k),0,0,7);c.stroke();}}
    else{c.fillStyle='rgba(255,255,255,0.7)';c.beginPath();c.ellipse(g.px,g.py+0.01,g.prx*0.7,g.pry*0.5,0,0,7);c.fill();}
    for(let k=0;k<18;k++){const a=k/18*Math.PI*2,rx=g.px+Math.cos(a)*g.prx,ry=g.py+Math.sin(a)*g.pry;c.fillStyle=k%2?'#7a7e88':'#6a6e78';c.beginPath();c.ellipse(rx,ry,0.03,0.018,0,0,7);c.fill();c.fillStyle='rgba(255,255,255,0.8)';c.beginPath();c.ellipse(rx,ry-0.01,0.02,0.007,0,0,7);c.fill();}
    // 대나무 수도(출발)
    c.fillStyle='#7a9a3a';c.fillRect(g.sx-0.01,0.58,0.02,0.4);c.save();c.translate(g.sx,0.6);c.rotate(0.15);c.fillRect(0,-0.01,0.12,0.02);c.restore();
    // 카피바라 가족
    const order=[0,1,2],stand=[[g.px-g.prx-0.1,g.ground+0.12],[g.px-g.prx-0.02,g.ground+0.15],[g.px-g.prx+0.06,g.ground+0.17]];
    const inPool=[[g.px-g.prx*0.35,g.py+0.005],[g.px+g.prx*0.1,g.py+0.01],[g.px+g.prx*0.45,g.py+0.015]];
    if(!hide)for(const i of order){
      const f=S.fam[i],cs=0.06*f.s*g.k+0.012,k2=clamp((S.bloom-0.25-i*0.35)/0.4,0,1);
      if(k2<=0){const shake=(1-k2)*(0.004+0.006*cold)*Math.sin(t*45+f.ph);
        c.save();c.translate(stand[i][0]+shake,stand[i][1]);drawCapyBody(c,0,0,cs,sad?'sad':'help',t+f.ph,null);c.restore();
        c.fillStyle='#ffffff';c.beginPath();c.ellipse(stand[i][0]+cs*0.6,stand[i][1]-cs*1.15,cs*0.3,cs*0.12+cs*0.12*cold,0,0,7);c.fill();}
      else if(k2<1){const px=lerp(stand[i][0],inPool[i][0],k2),py=lerp(stand[i][1],inPool[i][1],k2)-Math.sin(k2*Math.PI)*0.12;
        c.save();c.translate(px,py);drawCapyBody(c,0,0,cs,'happy',t,null);c.restore();}
      else{drawCapyHeadInWater(c,inPool[i][0],inPool[i][1],cs*0.9,t,f.ph);}
    }
    // 입수 물보라
    // 파티클
    for(const p of S.p){
      if(p.k===0){c.fillStyle='rgba(255,255,255,0.9)';c.beginPath();c.arc(p.x,p.y,p.s,0,7);c.fill();}
      else if(p.k===1){const a=1-p.life/p.max,r=p.s*2;c.globalAlpha=0.5*a;c.drawImage(glowSprite('250,250,255'),p.x-r,p.y-r,r*2,r*2);c.globalAlpha=1;}

    c.restore();
    const X=u=>x+u*h,Y=v=>y+v*h,dad=stand[0],cs0=0.06*g.k+0.012;

    }
  };
  return S;
}

function drawThief(c,x,yb,s,t,run,caught){

  // 돈 자루
  if(!caught){c.save();c.translate(-0.35,-0.75);c.rotate(-0.3+lp*0.2);c.fillStyle='#c9a65a';c.beginPath();c.ellipse(0,0,0.28,0.32,0,0,7);c.fill();
    c.fillStyle='#8a6a2a';c.font='bold 0.3px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('₩',0,0.03);c.restore();}

  c.strokeStyle='#2a1a10';c.lineCap='round';c.lineWidth=R*0.06;
  // 눈
  if(sleeping||(heal<0.5&&sick>0.15)){
    c.beginPath();c.arc(x-R*0.4,y-R*0.15,R*0.12,0.25,Math.PI-0.25);c.stroke();c.beginPath();c.arc(x+R*0.4,y-R*0.15,R*0.12,0.25,Math.PI-0.25);c.stroke();

  const bl=heal>0?0.55*heal:0.15*(1-sick);c.fillStyle=`rgba(255,110,130,${bl})`;c.beginPath();c.ellipse(x-R*0.66,y+R*0.12,R*0.17,R*0.1,0,0,7);c.ellipse(x+R*0.66,y+R*0.12,R*0.17,R*0.1,0,0,7);c.fill();

  if(heal<0.6){
    c.globalAlpha=1-heal/0.6;
    c.fillStyle='#a8dcff';rr(c,x-R*0.42,y-R*0.86,R*0.84,R*0.26,R*0.1);c.fill();c.strokeStyle='#5aa8e0';c.lineWidth=R*0.03;c.stroke();

    c.globalAlpha=1;
  }

function levelCfg(n){
  return {countdown:30*DF().mult,tileTime:Math.max(0.85,3.0-(n-1)*0.22),
    rocks:Math.min(10,Math.max(0,Math.floor((n-2)*1.5))),oneWay:n>=5?Math.min(3,1+Math.floor((n-5)/2)):0,keyReq:(G.concept&&G.concept.keyRule)?(n<=2?1:n<=5?2:3):0,target:Math.min(26,8+(n-1)*2),crossReq:(G.concept&&G.concept.crossRule)?Math.min(6,n):0,minDist:Math.min(10,5+Math.floor((n-1)/2)),freeDir:n>=4};
}
function emptyCell(){return {t:null,dir:-1,fills:[],pt:0};}
function bfs(grid,a,b){
  const seen=new Set([a[0]*COLS+a[1]]);let q=[[a[0],a[1],0]];
  while(q.length){const nq=[];for(const [r,c,d] of q){if(r===b[0]&&c===b[1])return d;
    for(let k=0;k<4;k++){const nr=r+DY[k],nc=c+DX[k];if(nr<0||nc<0||nr>=ROWS||nc>=COLS)continue;const id=nr*COLS+nc;if(seen.has(id)||grid[nr][nc].t)continue;seen.add(id);nq.push([nr,nc,d+1]);}}q=nq;}
  return -1;
}
function longPathOk(grid,so,gi,req){
  let steps=0;const vis=new Set();
  function dfs(r,c,len){
    if(++steps>40000)return false;
    if(r===gi[0]&&c===gi[1])return len>=req;
    vis.add(r*COLS+c);const ds=[0,1,2,3].sort(()=>Math.random()-0.5);
    for(const d of ds){const nr=r+DY[d],nc=c+DX[d];if(nr<0||nc<0||nr>=ROWS||nc>=COLS)continue;if(vis.has(nr*COLS+nc)||grid[nr][nc].t)continue;if(dfs(nr,nc,len+1)){vis.delete(r*COLS+c);return true;}}
    vis.delete(r*COLS+c);return false;
  }
  for(let k=0;k<3;k++){steps=0;vis.clear();if(dfs(so[0],so[1],1))return true;}
  return false;
}
/* 판 만들기: "정답 길"을 먼저 정하고 → 그 길 위 직선 칸에 화살표 파이프를 길 방향대로 박고 → 장애물은 길 밖에만.
   그래서 최소 파이프 수·크로스 수·화살표 통과 조건을 모두 만족하는 길이 항상 최소 1개 존재함 */
function findSolution(grid,st,gl,so,gi,req,needStraight){
  let steps=0;const vis=new Set(),path=[];
  const md=(r,c)=>Math.abs(r-gi[0])+Math.abs(c-gi[1]),maxLen=req+10;
  const straightCount=()=>{const full=[[st.r,st.c],...path,[gl.r,gl.c]];let k=0;
    for(let i=1;i<full.length-1;i++){const a=full[i-1],b=full[i],c=full[i+1];if(a[0]-b[0]===b[0]-c[0]&&a[1]-b[1]===b[1]-c[1])k++;}return k;};
  function dfs(r,c){
    if(++steps>60000)return false;
    path.push([r,c]);vis.add(r*COLS+c);
    if(r===gi[0]&&c===gi[1]){if(path.length>=req&&straightCount()>=needStraight)return true;}
    else if(path.length+md(r,c)<=maxLen){
      const ds=[0,1,2,3].sort(()=>Math.random()-0.5);
      for(const d of ds){const nr=r+DY[d],nc=c+DX[d];
        if(nr<0||nc<0||nr>=ROWS||nc>=COLS||vis.has(nr*COLS+nc)||grid[nr][nc].t)continue;
        if(dfs(nr,nc))return true;}
    }
    path.pop();vis.delete(r*COLS+c);return false;
  }
  return dfs(so[0],so[1])?path.slice():null;
}
function genLevel(cfg,depth){
  for(let tries=0;tries<300;tries++){
    const grid=[];for(let r=0;r<ROWS;r++){const row=[];for(let c=0;c<COLS;c++)row.push(emptyCell());grid.push(row);}
    let sr,sc,sd,gr,gc,gd;
    if(!cfg.freeDir){sc=0;sr=1+ri(ROWS-2);sd=E;gc=COLS-1;gr=ri(ROWS);gd=WW;}
    else{sr=ri(ROWS);sc=ri(COLS);gr=ri(ROWS);gc=ri(COLS);sd=ri(4);gd=ri(4);}
    const ok=(r,c)=>r>=0&&c>=0&&r<ROWS&&c<COLS;
    const so=[sr+DY[sd],sc+DX[sd]],gi=[gr+DY[gd],gc+DX[gd]];
    if(!ok(so[0],so[1])||!ok(gi[0],gi[1]))continue;
    if(sr===gr&&sc===gc)continue;
    if((so[0]===gr&&so[1]===gc)||(gi[0]===sr&&gi[1]===sc))continue;
    if(Math.abs(so[0]-gi[0])+Math.abs(so[1]-gi[1])<cfg.minDist-1)continue;
    grid[sr][sc]={t:'S',dir:sd,fills:[],pt:0};grid[gr][gc]={t:'G',dir:gd,fills:[],pt:0};
    const st={r:sr,c:sc},gl={r:gr,c:gc};
    const d=bfs(grid,so,gi);if(d<0)continue;
    const want=Math.max(d+1,cfg.target||0),req=want+((want-(d+1))%2);
    const nOne=cfg.oneWay||0,nCross=cfg.crossReq||0,nKey=cfg.keyReq||0;
    const path=findSolution(grid,st,gl,so,gi,req,nOne+nCross+nKey);
    if(!path)continue;
    // 정답 길의 직선 칸(진행 방향 포함) 목록
    const full=[[sr,sc],...path,[gr,gc]],straight=[];
    for(let i=2;i<full.length-2;i++){const a=full[i-1],b=full[i],c=full[i+1];
      if(a[0]-b[0]===b[0]-c[0]&&a[1]-b[1]===b[1]-c[1]){const dr=c[0]-b[0],dc=c[1]-b[1];straight.push({i,r:b[0],c:b[1],dir:DY.findIndex((y,k)=>y===dr&&DX[k]===dc)});}}
    if(straight.length<nOne+nCross+nKey)continue;
    // 화살표 파이프: 직선 칸 중 서로 떨어진 곳에 길 방향대로
    const pool=straight.slice().sort(()=>Math.random()-0.5),chosen=[];
    for(const sc2 of pool){if(chosen.length>=nOne)break;if(chosen.some(x=>Math.abs(x.i-sc2.i)<3))continue;chosen.push(sc2);}
    if(chosen.length<nOne)continue;
    for(const o of chosen)grid[o.r][o.c]={t:'O',dir:o.dir,fills:[],pt:0};
    // 필수 통과 아이템(보일러·돈가방): 남은 직선 칸 중 서로 떨어진 곳에
    const keys=[];for(const sc2 of pool){if(keys.length>=nKey)break;if(chosen.includes(sc2)||chosen.concat(keys).some(x=>Math.abs(x.i-sc2.i)<2))continue;keys.push(sc2);}
    if(keys.length<nKey)continue;
    for(const o of keys)grid[o.r][o.c]={t:'K',dir:o.dir,fills:[],pt:0};
    // 장애물: 정답 길·출발/도착 칸이 아닌 곳에만
    const onPath=new Set(full.map(([r,c])=>r*COLS+c));
    let n=cfg.rocks,guard=0;
    while(n>0&&guard++<400){const r=ri(ROWS),c=ri(COLS);if(onPath.has(r*COLS+c)||grid[r][c].t)continue;grid[r][c]={t:'R',dir:-1,fills:[],pt:0};n--;}
    G.grid=grid;G.start={r:sr,c:sc,dir:sd};G.goal={r:gr,c:gc,dir:gd};G.minLen=d+1;G.req=req;G.oneWayTotal=chosen.length;G.keyTotal=keys.length;G.solution=full;return;
  }
  if(!depth)genLevel(Object.assign({},cfg,{freeDir:false,rocks:0}),1);
}

function updateFlow(dt){
  let f=G.flow;if(!f)return;
  const slow=2.2,boost=Math.min(4,1+0.4*G.hurry),fast=G.fast?8*slow/boost:1;
  f.p+=dt*fast/(G.tileTime*slow/boost)/f.frac;
  while(f.p>=1){
    const over=(f.p-1)*f.frac;f.p=1;
    if(f.to===-1){win();return;}
    const nr=f.r+DY[f.to],nc=f.c+DX[f.to],inS=OPP(f.to);
    if(nr<0||nc<0||nr>=ROWS||nc>=COLS){leak(f);return;}

    }
    if(!seg){leak(f);return;}

    seg.hot=G.hot;
    cell.fills.push(seg);G.flow=seg;
    if(seg.to!==-1){
      G.pathLen++;const [x,y]=cellCenter(nr,nc);let pts=100+(G.fast?50:0);
      if(cell.t==='K'){pts+=300;addFloat(x,y-16,`${G.concept.keyIcon} ${G.concept.keyName} ${G.keyPassed}/${G.keyTotal} +300`,'#ffe14d',18);AU.bonus();}
      if(cell.t==='O'){pts+=300;G.oneWayPassed++;addFloat(x,y-16,`➡️ 화살표 ${G.oneWayPassed}/${G.oneWayTotal} +300`,'#ffe14d',18);AU.bonus();}
      if(cell.t==='X'&&cell.fills.length===1){G.crosses++;(G.crossCells=G.crossCells||[]).push([nr,nc]);if(G.crossReq){addFloat(x,y-14,`✚ 크로스 ${G.crosses}/${G.crossReq}`,'#c9a8ff',20);AU.bonus();}}

      addFloat(x,y,'+'+pts,'#bfefff',15);G.score+=pts;AU.glug();

  }
}

    addFloat(x,y-12,`✚ ${G.tallyIdx}  +200`,'#ffe14d',22);G.score+=200;AU.ding(G.tallyIdx);G.capyJump=0.5;

let LAY={};let spriteCache={};
function layout(){

    const p2=6,bb2=54;
    let sceneH=Math.round(clamp(H*0.24,130,W*0.7));
    const rest=H-sceneH-bb2-p2*4-BZ*2;
    const cell=Math.max(20,Math.floor(Math.min((W-p2*2-BZ*2)/COLS,rest/(ROWS+0.8))));
    const qh=Math.round(cell*0.78),gh=cell*ROWS;
    const used=sceneH+p2+qh+p2+BZ+gh+BZ+p2+bb2+p2;sceneH+=Math.max(0,H-used);
    const gx=Math.round((W-cell*COLS)/2),qy=sceneH+p2+4,gy=qy+qh+p2-4+BZ;
    LAY={portrait:true,scene:{x:0,y:0,w:W,h:sceneH},queue:{x:gx-BZ,y:qy,w:cell*COLS+BZ*2,h:qh,horiz:true},grid:{x:gx,y:gy,cell},bar:{x:gx-BZ,y:gy+gh+BZ+p2,w:cell*COLS+BZ*2,h:bb2}};
  }else{

    const cell=Math.max(20,Math.floor(Math.min((W-sceneW-pad*4-16)/(COLS+1.3),(H-bb-pad*2-BZ*2)/ROWS)));
    const gw=cell*COLS,qw=Math.round(cell*1.1),totalW=qw+pad+gw+16,ox=sceneW+Math.round((W-sceneW-totalW)/2);

function drawGuide(pt,isGoal){
  const s=LAY.grid.cell,nr=pt.r+DY[pt.dir],nc=pt.c+DX[pt.dir];

  const col=isGoal?'#ffd23a':'#5cc8ff',[nx,ny]=cellXY(nr,nc),[px,py]=cellXY(pt.r,pt.c);

    rr(ctx,nx+3,ny+3,s-6,s-6,8);ctx.stroke();ctx.restore();}

  const edge=sidePt(px,py,s,pt.dir),ctr=[nx+s/2,ny+s/2];

  for(let k=0;k<3;k++){const p=(G.time*1.2+k/3)%1;
    chevron(lerp(from[0],to[0],p),lerp(from[1],to[1],p),ang,s*0.17,col,Math.sin(Math.PI*p));}

  drawBar();drawOverlay();
  if(G.hurryShow>0&&G.phase==='flow'){
    const s=LAY.scene,a=Math.min(1,G.hurryShow/0.4),age=2.4-G.hurryShow,pop=age<0.25?0.6+1.6*age:1+0.06*Math.sin(G.time*14);
    ctx.font=`100px ${FT}`;const fit=s.w*0.9/ctx.measureText('⚡ HURRY UP! ⚡').width*100;
    const big=Math.min(s.h*0.24,fit)*pop,cx=s.x+s.w/2,cy=s.y+s.h*0.42,flash=Math.sin(G.time*20)>0;
    ctx.save();ctx.globalAlpha=a*0.35;ctx.fillStyle='#000';ctx.fillRect(s.x,cy-big*0.95,s.w,big*1.9);ctx.restore();
    txt('⚡ HURRY UP! ⚡',cx,cy,big,flash?'#ffe14d':'#ff5a3a',{font:FT,stroke:'#000',sw:big*0.14,glow:'#ff3000',blur:22,alpha:a});
    txt(`${G.concept.fluidSubj||'물이'} 빨라져요!`,cx,cy+big*0.75,Math.max(14,big*0.38),'#ffffff',{font:FT,stroke:'#000',sw:5,alpha:a});
  }
}
function drawCard(cp,x,y,w,h,row){
  const pulse=0.5+0.5*Math.sin(G.time*4);
  ctx.save();rr(ctx,x,y,w,h,18);ctx.fillStyle=cp.locked?'#15172a':'#22142c';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=cp.locked?'#3a3d55':cp.color;
  if(!cp.locked){ctx.shadowColor=cp.color;ctx.shadowBlur=10+pulse*16;}ctx.stroke();ctx.restore();
  const a=cp.locked?0.45:1;
  if(row){
    const hasChip=!cp.locked&&(SAVE.best[bestKey(cp)]||1)>1;
    txt(cp.icon,x+h*0.55,hasChip?y+h*0.38:y+h/2,hasChip?h*0.4:h*0.48,'#fff',{alpha:a});
    txt(cp.name,x+h*1.05,y+h*0.37,Math.min(h*0.26,26),'#fff',{font:FT,align:'left',alpha:a});
    txt(cp.desc,x+h*1.05,y+h*0.68,Math.min(h*0.17,17),'#c9c3e0',{align:'left',alpha:a});
    if(cp.locked)txt('🔒 준비 중',x+w-14,y+h*0.37,14,'#9a9ab0',{align:'right'});else txt('▶',x+w-26,y+h/2,28+pulse*4,cp.color,{font:FT});
  }else{
    txt(cp.icon,x+w/2,y+h*0.3,h*0.3,'#fff',{alpha:a});
    txt(cp.name,x+w/2,y+h*0.6,Math.min(w*0.1,24),'#fff',{font:FT,alpha:a});
    txt(cp.desc,x+w/2,y+h*0.76,Math.min(w*0.06,15),'#c9c3e0',{alpha:a});
    if(cp.locked)txt('🔒 준비 중',x+w/2,y+h*0.9,13,'#9a9ab0');
  }
  const best=SAVE.best[bestKey(cp)]||1;
  G.btns.push({x,y,w,h,fn:()=>{if(cp.locked){AU.bump();addFloat(x+w/2,y+h/2,'곧 나와요!','#ffd54a',22);}else selectConcept(cp,best);}});
  if(!cp.locked&&best>1){
    txt(`⭐ ${best}단계부터`,row?x+w-14:x+w/2,row?y+h*0.2:y+h*0.9,13,'#ffd54a',{align:row?'right':'center',font:FT});
    const bw2=78,bh2=28;button(row?x+h*0.55-bw2/2:x+w-bw2-8,row?y+h-bh2-4:y+8,bw2,bh2,'처음부터','#3a3f5a',()=>selectConcept(cp,1),{size:13,r:10});
  }
}
function drawTitle(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0d0820');g.addColorStop(1,'#3a1010');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  for(const e of T.embers){ctx.fillStyle=`rgba(255,${140+e.h*80|0},40,${Math.max(0,e.a*(1-e.life/e.max))})`;ctx.beginPath();ctx.arc(e.x,e.y,e.s,0,7);ctx.fill();}
  ctx.globalCompositeOperation='source-over';
  const big=Math.min(W*0.14,H*0.1,84),ty=Math.max(big*1.1,H*0.11),bob=Math.sin(G.time*2.5)*3;
  txt('시우의',W/2,ty-big*0.78,big*0.42,'#ffd54a',{font:FT,stroke:'#3a1200',sw:5});
  txt('물길 대작전',W/2,ty+big*0.12+bob,big,'#ffffff',{font:FT,stroke:'#c3271c',sw:big*0.16,glow:'#ff6a2a',blur:24});
  txt('하고 싶은 컨셉을 골라요!',W/2,ty+big*1.0,Math.max(15,big*0.27),'#9fd8ff');
  let y0=ty+big*1.35;
  {const keys=Object.keys(DIFFS),bw=Math.min(118,(W-48)/3),bh=46,gx=(W-(bw*3+16))/2;
   keys.forEach((k,i)=>{const d=DIFFS[k],sel=SAVE.diff===k;
     button(gx+i*(bw+8),y0,bw,bh,`${d.icon} ${d.name}`,sel?d.col:'#2b3045',()=>{SAVE.diff=k;saveSave();},{size:18,glow:sel,tc:sel?'#fff':'#9aa0b8'});});
   y0+=bh+10;
   const d=DF();txt(d.mult===Infinity?'타이머 없이 버튼으로 물 보내기':d.mult===3?'물 나오기까지 90초':'물 나오기까지 30초',W/2,y0+6,14,'#c9c3e0');y0+=24;}
  const NC=CONCEPTS.length;
  if(H>=W){const cw=Math.min(W-32,460),gap=10,ch=clamp((H-y0-16)/NC-gap,60,110);CONCEPTS.forEach((cp,i)=>drawCard(cp,(W-cw)/2,y0+i*(ch+gap),cw,ch,true));y0+=NC*(ch+gap);}
  else{const cols=3,rows=Math.ceil(NC/cols),cw=Math.min((W-64)/cols,300),ch=clamp((H-y0-16)/rows-12,80,180);CONCEPTS.forEach((cp,i)=>drawCard(cp,(W-(cw*cols+16*(cols-1)))/2+(i%cols)*(cw+16),y0+Math.floor(i/cols)*(ch+12),cw,ch,false));y0+=rows*(ch+12);}
  button(W-58,10,48,48,SAVE.muted?'🔇':'🔊','#3a3f5a',toggleMute,{size:20});
}

/* ================= 업데이트 루프 ================= */
function update(dt){
  AU.update();
  for(const f of G.floats)f.t+=dt;G.floats=G.floats.filter(f=>f.t<1.1);
  if(G.screen==='title'){
    if(Math.random()<dt*25)T.embers.push({x:Math.random()*W,y:H+5,vx:rnd(-15,15),vy:rnd(-90,-40),s:rnd(1,3.2),h:Math.random(),a:rnd(0.4,0.9),life:0,max:rnd(3,7)});
    for(const e of T.embers){e.life+=dt;e.x+=e.vx*dt+Math.sin(e.life*3)*0.4;e.y+=e.vy*dt;}
    T.embers=T.embers.filter(e=>e.life<e.max);
    if(AU.c){AU.waterG.gain.setTargetAtTime(0,AU.c.currentTime,0.1);AU.fireG.gain.setTargetAtTime(0,AU.c.currentTime,0.2);}
    return;
  }
  const ph=G.phase;
  if(G.lock>0)G.lock-=dt;
  if(G.pending.length){G.pending=G.pending.filter(pd=>{if(G.time<pd.at)return true;const cl=G.grid[pd.r][pd.c];
    if(!cl.t&&!cl.fills.length&&(G.phase==='countdown'||G.phase==='flow')){cl.t=pd.type;cl.pt=G.time;AU.place();}return false;});}
  G.qShift=Math.max(0,G.qShift-dt*7);G.shake=Math.max(0,G.shake-dt);
  if(ph==='countdown'){
    if(!isFinite(G.countdown)){G.elapsed=Math.min(G.elapsed+dt,G.dangerT*0.35);}else{
    G.countdown-=dt;G.elapsed+=dt;}const sec=Math.ceil(G.countdown);
    if(sec<=5&&sec>0&&sec!==G.lastTick){G.lastTick=sec;AU.tick(sec);}
    if(G.countdown<=0)startFlow();
  }else if(ph==='flow'){G.elapsed+=dt*(G.fast?2:1);G.flowT+=dt;
    const hl=Math.floor(G.flowT/15);if(hl>G.hurry&&!G.fast){G.hurry=hl;G.hurryShow=2.4;AU.hurry();G.shake=0.25;}
    updateFlow(dt);}
  if(G.hurryShow>0)G.hurryShow-=dt;
  else if(ph==='leak'){
    G.resultT+=dt;const f=G.leakSeg;
    if(f){const s=LAY.grid.cell,[x,y]=cellXY(f.r,f.c),pt=sidePt(x,y,s,f.to),d=f.to;
    const n=Math.ceil(dt*90);for(let i=0;i<n;i++)G.fx.push({x:pt[0],y:pt[1],vx:DX[d]*rnd(60,170)+rnd(-50,50),vy:DY[d]*rnd(60,170)+rnd(-90,10),g:500,life:0,max:rnd(0.5,0.9),s:rnd(2,4),col:'#5cc8ff'});}
    if(G.resultT>1.8){G.phase='lost';AU.setMusic(null);if(G.loseReason!=='short')AU.lose();}
  }else if(ph==='saving'){
    G.resultT+=dt;
    if(G.resultT>3.3)startTally();
  }else if(ph==='tally'){updateTally(dt);
  }
  G.concept.scene.update(dt,G);
  for(const p of G.fx){p.life+=dt;p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  G.fx=G.fx.filter(p=>p.life<p.max);if(G.fx.length>500)G.fx.splice(0,G.fx.length-500);
  if(AU.c){
    const t=AU.c.currentTime,I=G.concept.scene.intensity;
    const wv=G.phase==='flow'?(G.fast?0.25:0.13):(G.phase==='saving'||G.phase==='leak')?0.32:0;
    AU.waterG.gain.setTargetAtTime(wv,t,0.1);AU.fireG.gain.setTargetAtTime(G.concept.fireSound?I*0.35:0,t,0.3);
    if(G.concept.fireSound){if(Math.random()<I*dt*3)AU.crackle(rnd(0.05,0.12)*I);}
    else if(G.concept.id==='garden'&&G.phase!=='lost'&&Math.random()<dt*(G.phase==='won'?1.2:0.35))AU.chirp(AU.c.currentTime,0.05,AU.sfx);
  }
}
function draw(){
  G.btns=[];ctx.setTransform(DPR,0,0,DPR,0,0);
  if(G.screen==='title')drawTitle();else drawPlay();
  drawFloats();
}
let last=performance.now();
function frame(now){const [vw,vh]=viewSize();if(vw!==W||vh!==H)resize();const dt=Math.min(0.05,(now-last)/1000);last=now;G.time+=dt;update(dt);draw();requestAnimationFrame(frame);}

/* ================= 입력 ================= */
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();AU.init();
  const rc=cv.getBoundingClientRect(),x=(e.clientX-rc.left)*W/rc.width,y=(e.clientY-rc.top)*H/rc.height;G.press={x,y,t:G.time};
  for(let i=G.btns.length-1;i>=0;i--){const b=G.btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){if(b.fn){AU.click();b.fn();}return;}}
  if(G.screen==='play'&&G.phase==='tally'){finishTally();return;}
  if(G.screen==='play')gridTap(x,y);
},{passive:false});
cv.addEventListener('pointerup',()=>{G.press=null;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));
if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);

resize();
try{Promise.all([document.fonts.load('20px "Jua"'),document.fonts.load('20px "Black Han Sans"')]).then(()=>{spriteCache={};}).catch(()=>{});}catch(e){}
requestAnimationFrame(frame);
</script>

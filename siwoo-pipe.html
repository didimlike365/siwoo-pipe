    // 카피바라 정원사

    S.capyScreen={x:x+cap.x*h,y:y+(g.capY-0.9*cs)*h,size:cs*h*1.4};

    txt('시우네 꽃밭',X(A*0.5),Y(0.429),Math.max(10,h*0.038),'#fff',{font:FT,stroke:'#6a3d1a',sw:3});

}

  else{c.beginPath();c.arc(x-s*0.4,wy+s*0.02,s*0.09,0,7);c.arc(x+s*0.4,wy+s*0.02,s*0.09,0,7);c.fill();}}

  c.fillStyle=fc;rr(c,gx+gw*0.15,gy+gh*(1-fuel)+gh*0.04,gw*0.7,gh*fuel-gh*0.08>0?gh*fuel-gh*0.08:0.001,gw*0.3);c.fill();

function makeRocketScene(){
  const S={A:1.5,p:[],intensity:0.3,time:0,lift:0,vel:0,ign:0,fuel:0.15,stars:[]};
  S.reset=function(){
    S.p=[];S.intensity=0.3;S.time=0;S.lift=0;S.vel=0;S.ign=0;S.fuel=0.15;
    S.stars=[];for(let i=0;i<90;i++)S.stars.push({x:Math.random()*3,y:Math.random()*3-2,r:rnd(0.002,0.006),t:Math.random()*6});
  };
  S.geom=function(A){const k=clamp(A/1.6,0.6,1);return {k,ground:0.88,rx:A*0.62,rw:0.085*k+0.02,rh:0.4*k+0.06,tx:0.13,ty:0.88};};
  S.update=function(dt,G){
    S.time+=dt;const ph=G.phase==='tally'?'won':G.phase;let target=0.3,rate=0.25;
    if(ph==='countdown'||ph==='flow')target=0.3+0.65*clamp(G.elapsed/G.dangerT,0,1);
    else if(ph==='saving'||ph==='won'){target=0;rate=0.6;}
    else if(ph==='leak'||ph==='lost'){target=1;rate=0.5;}
    S.intensity+=clamp(target-S.intensity,-rate*dt,rate*dt);
    const g=S.geom(S.A);
    let ft=0.15+0.6*Math.min(1,G.pathLen/Math.max(1,G.req));
    if(ph==='saving'||ph==='won')ft=1;else if(ph==='lost')ft=0.05;
    S.fuel+=clamp(ft-S.fuel,-0.5*dt,0.8*dt);
    if(ph==='saving'||ph==='won'){
      const tt=ph==='saving'?G.resultT:3.3+G.resultT;
      S.ign=clamp((tt-0.3)/0.7,0,1);
      if(tt>1.1){S.vel+=0.55*dt;S.lift+=S.vel*dt;}
    }else if(ph==='lost'){S.ign=Math.max(0,S.ign-dt);}
    else S.ign=0;
    // 김(대기 중 증기): 급할수록 많이
    const ryb=g.ground-0.03-S.lift+Math.max(0,S.lift-0.2);
    if(S.lift<0.05&&(ph==='countdown'||ph==='flow'||ph==='ready')&&Math.random()<dt*(2+10*S.intensity)){
      const side=Math.random()<0.5?-1:1;S.p.push({k:1,x:g.rx+side*g.rw*0.6,y:g.ground-0.04,vx:side*rnd(0.03,0.08),vy:rnd(-0.06,-0.02),life:0,max:rnd(1.2,2),s:rnd(0.02,0.035)});}
    // 엔진 불꽃 + 연기
    if(S.ign>0){
      const n=Math.ceil(dt*90*S.ign);
      for(let j=0;j<n;j++)S.p.push({k:0,x:g.rx+rnd(-0.015,0.015),y:ryb+g.rh*0.06,vx:rnd(-0.03,0.03),vy:rnd(0.25,0.5),life:0,max:rnd(0.25,0.45),s:rnd(0.018,0.032)*(0.6+S.ign*0.6)});
      if(S.lift<0.6&&Math.random()<dt*25*S.ign){const side=Math.random()<0.5?-1:1;
        S.p.push({k:2,x:g.rx+side*rnd(0,0.05),y:g.ground-0.02,vx:side*rnd(0.1,0.35),vy:rnd(-0.08,-0.01),life:0,max:rnd(1.5,2.6),s:rnd(0.03,0.05)});}
    }
    if(ph==='lost'&&Math.random()<dt*4)S.p.push({k:2,x:g.rx+rnd(-0.02,0.02),y:g.ground-0.03,vx:rnd(-0.04,0.04),vy:rnd(-0.08,-0.03),life:0,max:1.5,s:0.025});
    for(const p of S.p){p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k===1||p.k===2){p.s+=0.04*dt;p.vx*=0.99;}}
    S.p=S.p.filter(p=>p.life<p.max);if(S.p.length>650)S.p.splice(0,S.p.length-650);
  };
  S.draw=function(c,rect,G){
    const {x,y,w,h}=rect,A=w/h;S.A=A;const g=S.geom(A),I=S.intensity,t=S.time;
    const cam=Math.max(0,S.lift-0.2),space=clamp(cam/1.2,0,1);
    c.save();c.beginPath();c.rect(x,y,w,h);c.clip();c.translate(x,y);c.scale(h,h);
    const gr=c.createLinearGradient(0,0,0,1);gr.addColorStop(0,mix('#1a1240','#03040c',space));gr.addColorStop(0.6,mix('#5a2a6a','#070818',space));gr.addColorStop(1,mix('#ff8a4a','#0a0c20',space));
    c.fillStyle=gr;c.fillRect(0,0,A,1);
    // 별 (발사 후엔 아래로 흐름)
    c.fillStyle='#fff';
    for(const s of S.stars){if(s.x>A)continue;let yy=((s.y+cam*1.5)%3+3)%3-2;if(yy<0||yy>1)continue;
      c.globalAlpha=(0.3+0.4*Math.sin(t*2+s.t))*(0.35+0.65*space)+space*0.2;
      if(S.vel>0.4){c.fillRect(s.x,yy,s.r,s.r+S.vel*0.02);}else{c.beginPath();c.arc(s.x,yy,s.r,0,7);c.fill();}}
    c.globalAlpha=1;
    // 행성 (우주에 가면 보임)
    if(space>0.2){c.globalAlpha=space;const pg=c.createRadialGradient(A*0.2,0.25,0.01,A*0.22,0.28,0.12);pg.addColorStop(0,'#ffd27a');pg.addColorStop(1,'#c2582a');c.fillStyle=pg;c.beginPath();c.arc(A*0.22,0.28,0.1,0,7);c.fill();
      c.strokeStyle='rgba(255,220,160,0.7)';c.lineWidth=0.008;c.beginPath();c.ellipse(A*0.22,0.28,0.16,0.035,-0.3,0,7);c.stroke();c.globalAlpha=1;}
    // 지상 (카메라 따라 내려감)
    c.save();c.translate(0,cam);
    if(cam<1.2){
      // 먼 산
      c.fillStyle='#2a1a3a';c.beginPath();c.moveTo(0,0.8);for(let xx=0;xx<=A+0.1;xx+=0.15)c.lineTo(xx,0.74+Math.sin(xx*7)*0.03);c.lineTo(A,0.9);c.lineTo(0,0.9);c.fill();
      c.fillStyle='#3a3a4a';c.fillRect(0,g.ground,A,0.3);
      // 발사대
      c.fillStyle='#6a6e80';c.fillRect(g.rx-g.rw*1.6,g.ground-0.03,g.rw*3.2,0.03);
      c.fillStyle='#4a4e60';c.fillRect(g.rx-g.rw*1.4,g.ground-0.012,g.rw*0.3,0.012);c.fillRect(g.rx+g.rw*1.1,g.ground-0.012,g.rw*0.3,0.012);
      // 발사탑
      const twx=g.rx+g.rw*1.25,twh=g.rh*1.15,tww=0.045;
      c.strokeStyle='#d9342a';c.lineWidth=0.006;c.strokeRect(twx,g.ground-0.03-twh,tww,twh);
      for(let yy=0;yy<twh;yy+=0.04){c.beginPath();c.moveTo(twx,g.ground-0.03-yy);c.lineTo(twx+tww,g.ground-0.07-yy);c.stroke();}
      const armOut=S.ign>0?Math.max(0,1-S.ign*2):1;c.fillStyle='#b8231c';c.fillRect(twx-g.rw*0.55*armOut,g.ground-0.03-g.rh*0.7,g.rw*0.55*armOut+0.005,0.012);
      // 경고등 (급할수록 빠르게, 빨강)
      const blink=Math.sin(t*(4+14*I))>0;c.fillStyle=blink?(I>0.7?'#ff3020':'#ffb020'):'#4a3020';
      c.beginPath();c.arc(twx+tww/2,g.ground-0.04-twh,0.012,0,7);c.fill();
      if(blink){c.globalCompositeOperation='lighter';c.drawImage(glowSprite(I>0.7?'255,60,30':'255,180,40'),twx+tww/2-0.06,g.ground-0.04-twh-0.06,0.12,0.12);c.globalCompositeOperation='source-over';}
      // 연료 탱크
      const tkx=g.tx,tkw=0.11,tkh=0.17;
      const tg=c.createLinearGradient(tkx-tkw/2,0,tkx+tkw/2,0);tg.addColorStop(0,'#c8ccd8');tg.addColorStop(0.5,'#f2f4fa');tg.addColorStop(1,'#9aa0b4');
      c.fillStyle=tg;rr(c,tkx-tkw/2,g.ground-tkh,tkw,tkh,0.03);c.fill();
      c.fillStyle='#ff9a2a';c.fillRect(tkx-tkw/2,g.ground-tkh*0.55,tkw,0.02);
      c.strokeStyle='#ff9a2a';c.lineWidth=0.02;c.lineCap='round';c.beginPath();c.moveTo(tkx+tkw/2,g.ground-0.04);c.quadraticCurveTo(tkx+0.12,0.96,tkx+0.08,1.1);c.stroke();
    }
    c.restore();
    // 증기·연기
    const sm=glowSprite('230,230,240'),sm2=glowSprite('120,120,135');
    for(const p of S.p){if(p.k===1||p.k===2){const a=1-p.life/p.max,r=p.s*2;c.globalAlpha=(p.k===1?0.5:0.6)*a;c.drawImage(p.k===1?sm:sm2,p.x-r,p.y+cam-r,r*2,r*2);}}
    c.globalAlpha=1;
    // 로켓
    const ryb=g.ground-0.03-S.lift+cam;
    const shake=(S.ign>0&&S.lift<0.2)?rnd(-0.003,0.003):0;
    const mood=(G.phase==='saving'||G.phase==='won')?'happy':(G.phase==='lost'||G.phase==='leak')?'sad':'help';
    // 불꽃
    c.globalCompositeOperation='lighter';
    for(const p of S.p)if(p.k===0){const q=p.life/p.max,col=q<0.3?'255,245,200':q<0.6?'255,170,50':'255,80,20',r=p.s*(1-q*0.4)*1.8;
      c.globalAlpha=(1-q)*0.7;c.drawImage(glowSprite(col),p.x-r+shake,p.y-S.lift+cam-r,r*2,r*2.4);}
    c.globalAlpha=1;c.globalCompositeOperation='source-over';
    const hideCap=G.phase==='tally'||G.phase==='won';
    drawRocketBody(c,g.rx+shake,ryb,g.rw,g.rh,S.fuel,t,hideCap?'hide':mood,S.ign);

    c.restore();
    const X=u=>x+u*h,Y=v=>y+v*h;
    if(cam<0.4)txt('연료',X(g.tx),Y(g.ground-0.065+cam),Math.max(10,h*0.04),'#7a3a00',{font:FT});
    const msg=mood==='happy'?(S.lift>0.2?'우주로 출발~!':'점화 성공!'):mood==='sad'?'다시 해봐요!':(I>0.65?'발사 시간이 다가와요!':'연료를 넣어줘요!');
    if(!hideCap)bubble(X(g.rx),Y(ryb-g.rh*0.98)+Math.sin(t*4)*2,msg,Math.max(11,h*0.045),rect);
  };

function makeDadScene(){

    S.smoke=[];S.shoot=null;S.shootT=rnd(2,5);};
  S.geom=function(A){const k=clamp(A/2.2,0.5,1);
    return {k,side:0.76,road:0.81,lane:0.9,lane2:0.985,
      ox:A*0.6,ow:Math.max(0.12,Math.min(A*0.16,0.36)),

      hx:A*0.03,hw:Math.max(0.16,Math.min(A*0.17,0.4)),
      busX:A*0.25};};
  S.update=function(dt,G){
    S.time+=dt;const ph=G.phase==='tally'?'won':G.phase;let target=0.3,rate=0.25;
    if(ph==='countdown'||ph==='flow')target=0.3+0.65*clamp(G.elapsed/G.dangerT,0,1);
    else if(ph==='saving'||ph==='won'){target=0.15;rate=0.4;}
    else if(ph==='leak'||ph==='lost'){target=0.8;rate=0.4;}

    const urg=clamp((S.intensity-0.3)/0.65,0,1);
    if(ph==='saving'||ph==='won')S.win+=dt;
    if(ph==='lost'||ph==='leak')S.lose+=dt;
    if(G.announce&&G.announce.t>0)G.announce.t-=dt;
    // 아빠 차 위치: 연결된 길만큼 집 쪽으로

    const jam=ph==='lost'||ph==='leak'?1:ph==='countdown'?urg:ph==='flow'?0.2:0;
    for(const cr of S.cars){cr.v=lerp(0.5,0.06,jam);cr.x+=cr.v*dt;if(cr.x>S.A+0.1)cr.x=-rnd(0.3,0.9);}

const G={screen:'title',concept:CONCEPTS[0],level:1,score:0,phase:'ready',grid:null,queue:[],btns:[],fx:[],floats:[],time:0,shake:0,press:null,qShift:0,lock:0};

function levelCfg(n){
  return {countdown:30*DF().mult,tileTime:Math.max(0.85,3.0-(n-1)*0.22),
    rocks:Math.min(10,Math.max(0,Math.floor((n-2)*1.5))),oneWay:n>=5?Math.min(3,1+Math.floor((n-5)/2)):0,keyReq:(G.concept&&G.concept.keyRule)?Math.max(G.concept.keyMin||0,n<=2?1:n<=5?2:3):0,target:Math.min(26,8+(n-1)*2),crossReq:(G.concept&&G.concept.crossRule)?Math.min(6,n):0,minDist:Math.min(10,5+Math.floor((n-1)/2)),freeDir:n>=4};
}
function emptyCell(){return {t:null,dir:-1,fills:[],pt:0};}
function bfs(grid,a,b){
  const seen=new Set([a[0]*COLS+a[1]]);let q=[[a[0],a[1],0]];
  while(q.length){const nq=[];for(const [r,c,d] of q){if(r===b[0]&&c===b[1])return d;
    for(let k=0;k<4;k++){const nr=r+DY[k],nc=c+DX[k];if(nr<0||nc<0||nr>=ROWS||nc>=COLS)continue;const id=nr*COLS+nc;if(seen.has(id)||grid[nr][nc].t)continue;seen.add(id);nq.push([nr,nc,d+1]);}}q=nq;}
  return -1;
}
function longPathOk(grid,so,gi,req){
  let steps=0;const vis=new Set();
  function dfs(r,c,len){
    if(++steps>40000)return false;
    if(r===gi[0]&&c===gi[1])return len>=req;
    vis.add(r*COLS+c);const ds=[0,1,2,3].sort(()=>Math.random()-0.5);
    for(const d of ds){const nr=r+DY[d],nc=c+DX[d];if(nr<0||nc<0||nr>=ROWS||nc>=COLS)continue;if(vis.has(nr*COLS+nc)||grid[nr][nc].t)continue;if(dfs(nr,nc,len+1)){vis.delete(r*COLS+c);return true;}}
    vis.delete(r*COLS+c);return false;
  }
  for(let k=0;k<3;k++){steps=0;vis.clear();if(dfs(so[0],so[1],1))return true;}
  return false;
}
/* 판 만들기: "정답 길"을 먼저 정하고 → 그 길 위 직선 칸에 화살표 파이프를 길 방향대로 박고 → 장애물은 길 밖에만.
   그래서 최소 파이프 수·크로스 수·화살표 통과 조건을 모두 만족하는 길이 항상 최소 1개 존재함 */
function findSolution(grid,st,gl,so,gi,req,needStraight){
  let steps=0;const vis=new Set(),path=[];
  const md=(r,c)=>Math.abs(r-gi[0])+Math.abs(c-gi[1]),maxLen=req+10;
  const straightCount=()=>{const full=[[st.r,st.c],...path,[gl.r,gl.c]];let k=0;
    for(let i=1;i<full.length-1;i++){const a=full[i-1],b=full[i],c=full[i+1];if(a[0]-b[0]===b[0]-c[0]&&a[1]-b[1]===b[1]-c[1])k++;}return k;};
  function dfs(r,c){
    if(++steps>60000)return false;
    path.push([r,c]);vis.add(r*COLS+c);
    if(r===gi[0]&&c===gi[1]){if(path.length>=req&&straightCount()>=needStraight)return true;}
    else if(path.length+md(r,c)<=maxLen){
      const ds=[0,1,2,3].sort(()=>Math.random()-0.5);
      for(const d of ds){const nr=r+DY[d],nc=c+DX[d];
        if(nr<0||nc<0||nr>=ROWS||nc>=COLS||vis.has(nr*COLS+nc)||grid[nr][nc].t)continue;
        if(dfs(nr,nc))return true;}
    }
    path.pop();vis.delete(r*COLS+c);return false;
  }
  return dfs(so[0],so[1])?path.slice():null;
}
function genLevel(cfg,depth){
  for(let tries=0;tries<300;tries++){
    const grid=[];for(let r=0;r<ROWS;r++){const row=[];for(let c=0;c<COLS;c++)row.push(emptyCell());grid.push(row);}
    let sr,sc,sd,gr,gc,gd;
    if(!cfg.freeDir){sc=0;sr=1+ri(ROWS-2);sd=E;gc=COLS-1;gr=ri(ROWS);gd=WW;}
    else{sr=ri(ROWS);sc=ri(COLS);gr=ri(ROWS);gc=ri(COLS);sd=ri(4);gd=ri(4);}
    const ok=(r,c)=>r>=0&&c>=0&&r<ROWS&&c<COLS;
    const so=[sr+DY[sd],sc+DX[sd]],gi=[gr+DY[gd],gc+DX[gd]];
    if(!ok(so[0],so[1])||!ok(gi[0],gi[1]))continue;
    if(sr===gr&&sc===gc)continue;
    if((so[0]===gr&&so[1]===gc)||(gi[0]===sr&&gi[1]===sc))continue;
    if(Math.abs(so[0]-gi[0])+Math.abs(so[1]-gi[1])<cfg.minDist-1)continue;
    grid[sr][sc]={t:'S',dir:sd,fills:[],pt:0};grid[gr][gc]={t:'G',dir:gd,fills:[],pt:0};
    const st={r:sr,c:sc},gl={r:gr,c:gc};
    const d=bfs(grid,so,gi);if(d<0)continue;
    const want=Math.max(d+1,cfg.target||0),req=want+((want-(d+1))%2);
    const nOne=cfg.oneWay||0,nCross=cfg.crossReq||0,nKey=cfg.keyReq||0;
    const path=findSolution(grid,st,gl,so,gi,req,nOne+nCross+nKey);
    if(!path)continue;
    // 정답 길의 직선 칸(진행 방향 포함) 목록
    const full=[[sr,sc],...path,[gr,gc]],straight=[];
    for(let i=2;i<full.length-2;i++){const a=full[i-1],b=full[i],c=full[i+1];
      if(a[0]-b[0]===b[0]-c[0]&&a[1]-b[1]===b[1]-c[1]){const dr=c[0]-b[0],dc=c[1]-b[1];straight.push({i,r:b[0],c:b[1],dir:DY.findIndex((y,k)=>y===dr&&DX[k]===dc)});}}
    if(straight.length<nOne+nCross+nKey)continue;
    // 화살표 파이프: 직선 칸 중 서로 떨어진 곳에 길 방향대로
    const pool=straight.slice().sort(()=>Math.random()-0.5),chosen=[];
    for(const sc2 of pool){if(chosen.length>=nOne)break;if(chosen.some(x=>Math.abs(x.i-sc2.i)<3))continue;chosen.push(sc2);}
    if(chosen.length<nOne)continue;
    for(const o of chosen)grid[o.r][o.c]={t:'O',dir:o.dir,fills:[],pt:0};
    // 필수 통과 아이템(보일러·돈가방): 남은 직선 칸 중 서로 떨어진 곳에
    const keys=[];for(const sc2 of pool){if(keys.length>=nKey)break;if(chosen.includes(sc2)||chosen.concat(keys).some(x=>Math.abs(x.i-sc2.i)<2))continue;keys.push(sc2);}
    if(keys.length<nKey)continue;
    for(const o of keys)grid[o.r][o.c]={t:'K',dir:o.dir,fills:[],pt:0};
    // 장애물: 정답 길·출발/도착 칸이 아닌 곳에만
    const onPath=new Set(full.map(([r,c])=>r*COLS+c));
    let n=cfg.rocks,guard=0;
    while(n>0&&guard++<400){const r=ri(ROWS),c=ri(COLS);if(onPath.has(r*COLS+c)||grid[r][c].t)continue;grid[r][c]={t:'R',dir:-1,fills:[],pt:0};n--;}
    G.grid=grid;G.start={r:sr,c:sc,dir:sd};G.goal={r:gr,c:gc,dir:gd};G.minLen=d+1;G.req=req;G.oneWayTotal=chosen.length;G.keyTotal=keys.length;G.solution=full;return;
  }
  if(!depth)genLevel(Object.assign({},cfg,{freeDir:false,rocks:0}),1);
}
function startLevel(n,retry){
  const cfg=levelCfg(n);G.level=n;G.cfg=cfg;G.levelStartScore=G.score;
  G.req=0;G.oneWayTotal=0;G.keyTotal=0;G.wrapRows=[];G.wrapCols=[];G.masterCross=0;
  const sn=G.snap,same=retry&&DF().master&&sn&&sn.level===n&&sn.concept===G.concept.id&&sn.diff===SAVE.diff;
  if(same){ // 초고수 재도전: 같은 맵 그대로
    G.grid=sn.grid.map(row=>row.map(c=>({t:c.t,dir:c.dir,fills:[],pt:0})));
    Object.assign(G,{start:{...sn.start},goal:{...sn.goal},wrapRows:sn.wrapRows.slice(),wrapCols:sn.wrapCols.slice(),req:sn.req,minLen:sn.minLen,
      oneWayTotal:sn.oneWayTotal,keyTotal:sn.keyTotal,masterCross:sn.masterCross,masterPath:sn.masterPath,solution:sn.solution});
  }else{
    if(!(DF().master&&genMaster(cfg)))genLevel(cfg);if(!G.req)G.req=G.minLen;
    G.snap={level:n,concept:G.concept.id,diff:SAVE.diff,grid:G.grid.map(row=>row.map(c=>({t:c.t,dir:c.dir}))),start:{...G.start},goal:{...G.goal},
      wrapRows:(G.wrapRows||[]).slice(),wrapCols:(G.wrapCols||[]).slice(),req:G.req,minLen:G.minLen,oneWayTotal:G.oneWayTotal,keyTotal:G.keyTotal,
      masterCross:G.masterCross,masterPath:G.masterPath,solution:G.solution};
  }
  G.keyList=null;G.gotItems=[];
  if(G.concept.keyItems){const ks=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(G.grid[r][c].t==='K')ks.push(G.grid[r][c]);const its=G.concept.keyItems(ks.length);ks.forEach((cl,i)=>cl.item=its[i]);G.keyList=its;}
  G.queue=[];for(let i=0;i<5;i++)G.queue.push(newPiece());
  Object.assign(G,{announce:null,conn:[],connN:0,connPop:0,connReached:false,keyPassed:0,hot:false,crossCells:[],tallyList:[],tallyIdx:0,ttabongT:-1,oneWayPassed:0,flowT:0,hurry:0,hurryShow:0,crosses:0,crossReq:cfg.crossReq||0,phase:'ready',countdown:cfg.countdown,tileTime:cfg.tileTime,flow:null,fast:false,elapsed:0,replaces:0,pathLen:0,resultT:0,fx:[],floats:[],qShift:0,lock:0,lockMax:1,pending:[],lastTick:99,stars:0});
  G.dangerT=Math.min(cfg.countdown,90)+cfg.tileTime*(cfg.minDist+4);
  G.concept.scene.reset();AU.setMusic(G.concept.music||'play');
}

function gridTap(x,y){
  if(!(G.phase==='countdown'||G.phase==='flow'))return;
  const L=LAY.grid,c=Math.floor((x-L.x)/L.cell),r=Math.floor((y-L.y)/L.cell);
  if(r<0||c<0||r>=ROWS||c>=COLS)return;
  if(G.lock>0){AU.bump();if(!G.lastWait||G.time-G.lastWait>0.5){G.lastWait=G.time;const [wx,wy]=cellCenter(r,c);addFloat(wx,wy,'잠깐!','#ffd54a',18);}return;}
  const cell=G.grid[r][c],[cx,cy]=cellCenter(r,c);
  if(cell.t==='O'||cell.t==='K'){AU.bump();addFloat(cx,cy,'못 바꿔요!','#ffd54a',15);return;}
  if(cell.t==='S'||cell.t==='G'||cell.t==='R'){AU.bump();return;}
  if(cell.fills.length){AU.bump();addFloat(cx,cy,'물이 있어요!','#9fd8ff',15);return;}
  if(cell.t){

function startFlow(){

function updateFlow(dt){
  let f=G.flow;if(!f)return;
  const slow=2.2,boost=Math.min(4,1+0.4*G.hurry),fast=G.fast?8*slow/boost:1;
  f.p+=dt*fast/(G.tileTime*slow/boost)/f.frac;
  while(f.p>=1){
    const over=(f.p-1)*f.frac;f.p=1;
    if(f.to===-1){win();return;}
    const nx=nextCell(f.r,f.c,f.to),inS=OPP(f.to);
    if(!nx){leak(f);return;}const nr=nx[0],nc=nx[1];
    const cell=G.grid[nr][nc];let seg=null;
    if(cell.t==='G'){if(cell.dir===inS){if(G.pathLen<G.req||G.crosses<G.crossReq||G.oneWayPassed<G.oneWayTotal||G.keyPassed<G.keyTotal){shortFail(f);return;}seg={r:nr,c:nc,from:inS,to:-1,p:0,frac:0.5};}}
    else if(cell.t&&cell.t!=='S'&&cell.t!=='R'){
      const ex=cell.t==='O'?(inS===OPP(cell.dir)?cell.dir:-1):cell.t==='K'?(inS===OPP(cell.dir)?cell.dir:inS===cell.dir?OPP(cell.dir):-1):exitFor(cell.t,inS);
      if(cell.t==='O'&&ex<0){const [wx,wy]=cellCenter(nr,nc);addFloat(wx,wy-10,'반대 방향!','#ff7a6a',20);}
      if(ex>=0&&!cell.fills.some(s=>s.from===inS||s.to===inS))seg={r:nr,c:nc,from:inS,to:ex,p:0,frac:1};
    }
    if(!seg){leak(f);return;}
    if(cell.t==='K'){G.keyPassed++;if(G.concept.keyHeats)G.hot=true;}
    seg.hot=G.hot;
    cell.fills.push(seg);G.flow=seg;
    if(seg.to!==-1){
      G.pathLen++;const [x,y]=cellCenter(nr,nc);let pts=100+(G.fast?50:0);
      if(cell.t==='K'&&cell.item){const it=cell.item;(G.gotItems=G.gotItems||[]).push(it);G.announce={name:it.name,icon:it.icon,kind:it.kind,t:2.6};addFloat(x,y-16,`${it.icon} ${it.name} +300`,'#ffe14d',17);}
      else if(cell.t==='K'&&G.concept.stopNames){const nm=G.concept.stopNames[(G.keyPassed-1)%G.concept.stopNames.length];G.announce={name:nm,t:2.6};addFloat(x,y-16,`${G.concept.keyIcon} ${nm} +300`,'#ffe14d',17);}
      else if(cell.t==='K'){addFloat(x,y-16,`${G.concept.keyIcon} ${G.concept.keyName} ${G.keyPassed}/${G.keyTotal} +300`,'#ffe14d',18);}
      if(cell.t==='K'){pts+=300;if(G.concept.keySfx)G.concept.keySfx();else AU.bonus();}
      if(cell.t==='O'){pts+=300;G.oneWayPassed++;addFloat(x,y-16,`➡️ 화살표 ${G.oneWayPassed}/${G.oneWayTotal} +300`,'#ffe14d',18);AU.bonus();}
      if(cell.t==='X'&&cell.fills.length===1){G.crosses++;(G.crossCells=G.crossCells||[]).push([nr,nc]);if(G.crossReq){addFloat(x,y-14,`✚ 크로스 ${G.crosses}/${G.crossReq}`,'#c9a8ff',20);AU.bonus();}}
      if(cell.t==='X'&&cell.fills.length===2){pts+=400;addFloat(x,y-14,'크로스 보너스!','#ffe14d',20);AU.bonus();}
      addFloat(x,y,'+'+pts,'#bfefff',15);G.score+=pts;AU.glug();
    }
    f=seg;f.p=over/f.frac;
  }
}

/* ================= 초고수: 길 하나뿐인 판 + 포탈(벽끝 연결) + 크로스 강제 ================= */
function nextCell(r,c,d){
  let nr=r+DY[d],nc=c+DX[d];
  if(nr>=0&&nc>=0&&nr<ROWS&&nc<COLS)return [nr,nc];
  if((d===E||d===WW)&&G.wrapRows&&G.wrapRows.includes(r))return [r,(nc+COLS)%COLS];

}

  needX=needX||0;

    if(++steps>80000)return false;
    const cell=grid[r][c];
    if(cell.t==='G')return OPP(d)===cell.dir&&len>=req&&k>=needK&&o>=needO&&x>=needX;
    if(cell.t==='R'||cell.t==='S')return false;

    seen[key]=1;
    for(const od of outs){const q=nx(r,c,od);if(q&&go(q[0],q[1],od,len+1,k+(cell.t==='K'?1:0),o+(cell.t==='O'?1:0),x+(!cell.t&&od===d?1:0))){seen[key]=0;return true;}}
    seen[key]=0;return false;
  }
  const p0=nx(st.r,st.c,st.dir);return p0?go(p0[0],p0[1],st.dir,0,0,0,0):false;
}
function genMaster(cfg){
  const n=G.level,L=Math.min(28,12+n*2),needWrap=n%3!==1;
  // 크로스(길이 스스로 겹치는 곳) 최소 개수: 1단계 1개 → 2~3단계 2개 → 4단계부터 3개
  const minCross=n<=1?1:n<=3?2:3,L2=Math.max(12,L-minCross*2),maxLen=L2+5+minCross*3; // 크로스는 2칸으로 세니까 최소 길이는 그만큼 줄임
  const inb=(r,c)=>r>=0&&c>=0&&r<ROWS&&c<COLS;
  const nOne=cfg.oneWay||0,nKey=cfg.keyReq||0,nCrossReq=cfg.crossReq||0;
  for(let tries=0;tries<600;tries++){
    const sr=ri(ROWS),sc=ri(COLS),sd=ri(4),p0=[sr+DY[sd],sc+DX[sd]];
    if(!inb(p0[0],p0[1]))continue;
    const vis=new Map([[sr*COLS+sc,{cnt:9}]]),path=[],wrapRows=new Set(),wrapCols=new Set();let crossN=0,steps=0,goal=null;
    function dfs(r,c,inD){
      if(++steps>25000)return false;
      const key=r*COLS+c,v=vis.get(key);let outs;
      if(v){if(v.cnt!==1||v.kind!=='s'||v.axis===inD%2||path.length<3)return false;outs=[inD];}
      else{const tr=[(inD+1)%4,(inD+3)%4].sort(()=>Math.random()-0.5);outs=Math.random()<0.55?[inD,...tr]:[...tr,inD];
        // 지나온 직선 칸을 가로지를 수 있으면 그쪽을 먼저 시도 → 크로스가 자연스럽게 생김
        if(crossN<minCross+1&&path.length>=3){const cr=outs.filter(od=>{const nr=r+DY[od],nc=c+DX[od];if(!inb(nr,nc))return false;const w=vis.get(nr*COLS+nc);return w&&w.cnt===1&&w.kind==='s'&&w.axis!==od%2;});
          if(cr.length&&Math.random()<0.8)outs=[...cr,...outs.filter(o=>!cr.includes(o))];}}
      for(const od of outs){
        if(v){v.cnt=2;crossN++;}else vis.set(key,{cnt:1,kind:od===inD?'s':'t',axis:inD%2});
        path.push([r,c,inD,od]);

          const gr=r+DY[od],gc=c+DX[od];

        }
        if(path.length<maxLen){

          if(!inb(nr,nc)){
            const lanes=wrapRows.size+wrapCols.size,horiz=od===E||od===WW;
            if(horiz){if(wrapRows.has(r)||(needWrap&&lanes<2&&Math.random()<0.8)){if(!wrapRows.has(r)){wrapRows.add(r);added=['r',r];}nc=(nc+COLS)%COLS;}else ok=false;}
            else{if(wrapCols.has(c)||(needWrap&&lanes<2&&Math.random()<0.8)){if(!wrapCols.has(c)){wrapCols.add(c);added=['c',c];}nr=(nr+ROWS)%ROWS;}else ok=false;}
          }
          if(ok&&dfs(nr,nc,od))return true;

        }

      }

    }
    if(!dfs(p0[0],p0[1],sd))continue;
    // 포탈 줄은 실제로 쓴 것만 남김
    const usedR=new Set(),usedC=new Set();
    for(let i=0;i<path.length-1;i++){const [r,c,,od]=path[i],[r2,c2]=path[i+1];if(Math.abs(r2-r)+Math.abs(c2-c)>1){if(od===E||od===WW)usedR.add(r);else usedC.add(c);}}
    if(needWrap&&usedR.size+usedC.size===0)continue;

    const grid=[];for(let r=0;r<ROWS;r++){const row=[];for(let c=0;c<COLS;c++)row.push({t:'R',dir:-1,fills:[],pt:0});grid.push(row);}
    for(const [r,c] of path)grid[r][c]=emptyCell();
    grid[sr][sc]={t:'S',dir:sd,fills:[],pt:0};grid[goal[0]][goal[1]]={t:'G',dir:goal[2],fills:[],pt:0};
    const pool=straight.sort(()=>Math.random()-0.5),used=[];
    const take=(cnt,t)=>{let k=0;for(const o of pool){if(k>=cnt)break;if(used.some(x=>Math.abs(x.i-o.i)<2))continue;used.push(o);grid[o.r][o.c]={t,dir:o.dir,fills:[],pt:0};k++;}return k;};
    const gotO=take(nOne,'O'),gotK=take(nKey,'K');if(gotO<nOne||gotK<nKey)continue;

    let dec=3,g2=0;while(dec>0&&g2++<200){const r=ri(ROWS),c=ri(COLS);if(grid[r][c].t!=='R')continue;grid[r][c]=emptyCell();dec--;}
    // 크로스는 '강제'가 아니라 '효율': 크로스 없이도 목표 개수를 채우는 길이 있어야 함.
    // 없으면 길 옆 장애물을 조금씩 치워서 돌아가는 길을 만들어 줌 (크로스를 쓰면 파이프를 그만큼 아낌)
    if(crossCells.size){const st0={r:sr,c:sc,dir:sd},gl0={dir:goal[2]},wr=[...usedR],wc=[...usedC];let opened=0,okAlt=noCrossPath(grid,st0,path.length,wr,wc,gotK,gotO,Math.min(nCrossReq,crossCells.size));
      while(!okAlt&&opened<14){const cand=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(grid[r][c].t!=='R')continue;if([0,1,2,3].some(d=>{const nr=r+DY[d],nc=c+DX[d];return inb(nr,nc)&&(!grid[nr][nc].t||grid[nr][nc].t==='K'||grid[nr][nc].t==='O');}))cand.push([r,c]);}
        if(!cand.length)break;for(let k=0;k<2&&cand.length;k++){const [r,c]=cand.splice(ri(cand.length),1)[0];grid[r][c]=emptyCell();opened++;}
        okAlt=noCrossPath(grid,st0,path.length,wr,wc,gotK,gotO,Math.min(nCrossReq,crossCells.size));}
      if(!okAlt)continue;}
    G.grid=grid;G.start={r:sr,c:sc,dir:sd};G.goal={r:goal[0],c:goal[1],dir:goal[2]};
    G.wrapRows=[...usedR];G.wrapCols=[...usedC];G.req=path.length;G.minLen=path.length;
    G.oneWayTotal=gotO;G.keyTotal=gotK;G.masterPath=path;G.masterCross=crossCells.size;G.solution=null;return true;
  }

}

let LAY={};let spriteCache={};
function layout(){
  const pad=10,bb=58;
  if(H>=W){
    const p2=6,bb2=54;
    let sceneH=Math.round(clamp(H*0.24,130,W*0.7));
    const rest=H-sceneH-bb2-p2*4-BZ*2;
    const cell=Math.max(20,Math.floor(Math.min((W-p2*2-BZ*2)/COLS,rest/(ROWS+0.8))));
    const qh=Math.round(cell*0.78),gh=cell*ROWS;
    const used=sceneH+p2+qh+p2+BZ+gh+BZ+p2+bb2+p2;sceneH+=Math.max(0,H-used);
    const gx=Math.round((W-cell*COLS)/2),qy=sceneH+p2+4,gy=qy+qh+p2-4+BZ;
    LAY={portrait:true,scene:{x:0,y:0,w:W,h:sceneH},queue:{x:gx-BZ,y:qy,w:cell*COLS+BZ*2,h:qh,horiz:true},grid:{x:gx,y:gy,cell},bar:{x:gx-BZ,y:gy+gh+BZ+p2,w:cell*COLS+BZ*2,h:bb2}};
  }else{
    const sceneW=Math.round(W*0.38);
    const cell=Math.max(20,Math.floor(Math.min((W-sceneW-pad*4-16)/(COLS+1.3),(H-bb-pad*2-BZ*2)/ROWS)));
    const gw=cell*COLS,qw=Math.round(cell*1.1),totalW=qw+pad+gw+16,ox=sceneW+Math.round((W-sceneW-totalW)/2);
    const gx=ox+qw+pad+8,gy=pad+8;
    LAY={portrait:false,scene:{x:0,y:0,w:sceneW,h:H},queue:{x:ox,y:gy,w:qw,h:cell*ROWS,horiz:false},grid:{x:gx,y:gy,cell},bar:{x:gx-8,y:gy+cell*ROWS+8+pad,w:gw+16,h:bb}};

}

    if(cell.t==='G')return {cells:out,reached:cell.dir===inS};
    if(!cell.t||cell.t==='S'||cell.t==='R')break;

function update(dt){
  AU.update();
  for(const f of G.floats)f.t+=dt;G.floats=G.floats.filter(f=>f.t<1.1);
  if(G.screen==='title'){
    if(Math.random()<dt*25)T.embers.push({x:Math.random()*W,y:H+5,vx:rnd(-15,15),vy:rnd(-90,-40),s:rnd(1,3.2),h:Math.random(),a:rnd(0.4,0.9),life:0,max:rnd(3,7)});
    for(const e of T.embers){e.life+=dt;e.x+=e.vx*dt+Math.sin(e.life*3)*0.4;e.y+=e.vy*dt;}
    T.embers=T.embers.filter(e=>e.life<e.max);
    if(AU.c){AU.waterG.gain.setTargetAtTime(0,AU.c.currentTime,0.1);AU.fireG.gain.setTargetAtTime(0,AU.c.currentTime,0.2);}
    return;
  }
  const ph=G.phase;
  if(G.lock>0)G.lock-=dt;
  updateConn(dt);
  if(G.pending.length){G.pending=G.pending.filter(pd=>{if(G.time<pd.at)return true;const cl=G.grid[pd.r][pd.c];
    if(!cl.t&&!cl.fills.length&&(G.phase==='countdown'||G.phase==='flow')){cl.t=pd.type;cl.pt=G.time;AU.place();}return false;});}
  G.qShift=Math.max(0,G.qShift-dt*7);G.shake=Math.max(0,G.shake-dt);
  if(ph==='countdown'){
    if(!isFinite(G.countdown)){G.elapsed=Math.min(G.elapsed+dt,G.dangerT*0.35);}else{
    G.countdown-=dt;G.elapsed+=dt;}const sec=Math.ceil(G.countdown);
    if(sec<=5&&sec>0&&sec!==G.lastTick){G.lastTick=sec;AU.tick(sec);}
    if(G.countdown<=0)startFlow();
  }else if(ph==='flow'){G.elapsed+=dt*(G.fast?2:1);G.flowT+=dt;
    const hl=Math.floor(G.flowT/15);if(hl>G.hurry&&!G.fast){G.hurry=hl;G.hurryShow=2.4;AU.hurry();G.shake=0.25;}
    updateFlow(dt);}
  if(G.hurryShow>0)G.hurryShow-=dt;
  else if(ph==='leak'){
    G.resultT+=dt;const f=G.leakSeg;
    if(f){const s=LAY.grid.cell,[x,y]=cellXY(f.r,f.c),pt=sidePt(x,y,s,f.to),d=f.to;
    const n=Math.ceil(dt*90);for(let i=0;i<n;i++)G.fx.push({x:pt[0],y:pt[1],vx:DX[d]*rnd(60,170)+rnd(-50,50),vy:DY[d]*rnd(60,170)+rnd(-90,10),g:500,life:0,max:rnd(0.5,0.9),s:rnd(2,4),col:'#5cc8ff'});}
    if(G.resultT>1.8){G.phase='lost';AU.setMusic(null);if(G.loseReason!=='short')AU.lose();}
  }else if(ph==='saving'){
    G.resultT+=dt;
    if(G.resultT>3.3)startTally();
  }else if(ph==='tally'){updateTally(dt);
  }
  G.concept.scene.update(dt,G);
  for(const p of G.fx){p.life+=dt;p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  G.fx=G.fx.filter(p=>p.life<p.max);if(G.fx.length>500)G.fx.splice(0,G.fx.length-500);
  if(AU.c){
    const t=AU.c.currentTime,I=G.concept.scene.intensity;
    const wv=(G.phase==='saving'||G.phase==='leak')?0.12:0;
    if(wv&&Math.random()<0.25)AU.bubble(0.04);const calm=G.phase!=='flow';AU.fireG.gain.setTargetAtTime(G.concept.fireSound&&calm?I*0.1:0,t,0.3);
    if(G.concept.fireSound&&calm){if(Math.random()<I*dt*1.5)AU.crackle(rnd(0.03,0.06)*I);}
    else if(G.concept.id==='garden'&&G.phase!=='lost'&&Math.random()<dt*(G.phase==='won'?1.2:0.35))AU.chirp(AU.c.currentTime,0.05,AU.sfx);
  }
}
function draw(){
  G.btns=[];ctx.setTransform(DPR,0,0,DPR,0,0);
  if(G.screen==='title')drawTitle();else drawPlay();
  drawFloats();
}
let last=performance.now();
const PERF={a:[],t:0};
function perfCheck(raw){
  if(G.screen!=='play'||SAVE.lite!=='auto'||LITE||document.hidden){PERF.a.length=0;PERF.t=0;return;}
  PERF.t+=raw;if(PERF.t<1)return;PERF.a.push(raw);if(PERF.t<3||PERF.a.length<20)return;PERF.t=1;
  const s2=PERF.a.slice().sort((x,y)=>x-y),med=s2[s2.length>>1];PERF.a.length=0;
  if(med>0.024){SAVE.autoLite=true;saveSave();setLite(true);const sc=LAY.scene;addFloat(sc.x+sc.w/2,sc.y+sc.h*0.5,'🐢 가볍게 모드로 바꿨어요','#9fe8ff',18);}
}
function frame(now){const [vw,vh]=viewSize();if(vw!==W||vh!==H)resize();const raw=(now-last)/1000,dt=Math.min(0.05,raw);last=now;if(raw<0.5)perfCheck(raw);G.time+=dt;update(dt);draw();requestAnimationFrame(frame);}

/* ================= 입력 ================= */
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();AU.init();
  const rc=cv.getBoundingClientRect(),x=(e.clientX-rc.left)*W/rc.width,y=(e.clientY-rc.top)*H/rc.height;G.press={x,y,t:G.time};
  for(let i=G.btns.length-1;i>=0;i--){const b=G.btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){if(b.fn){AU.click();b.fn();}return;}}
  if(G.screen==='play'&&G.phase==='tally'){finishTally();return;}
  if(G.screen==='play')gridTap(x,y);
},{passive:false});
cv.addEventListener('pointerup',()=>{G.press=null;if(G.wantFS){G.wantFS=false;enterFS();}});
cv.addEventListener('click',()=>{if(G.wantFS){G.wantFS=false;enterFS();}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
setInterval(()=>{if(AU.c&&!document.hidden)AU.update();},50); // 화면이 버벅여도 음악 예약은 계속
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));
if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);

resize();
try{Promise.all([document.fonts.load('20px "Jua"'),document.fonts.load('20px "Black Han Sans"')]).then(()=>{spriteCache={};}).catch(()=>{});}catch(e){}
requestAnimationFrame(frame);
</script>
</body>
